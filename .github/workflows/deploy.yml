name: Deploy to CloudPanel

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22222
        script: |
          cd /home/magnetcrmak/htdocs/api.magnetcrm.com
          
          # Pull latest code
          git init
          git remote remove origin || true
          git remote add origin https://${{ secrets.PAT_TOKEN }}@github.com/inakashsingh/magnet-crm.git
          git fetch origin main
          git reset --hard origin/main
          
          # Setup Node Environment
          export PATH="/home/magnetcrmak/.nvm/versions/node/v18.20.8/bin:$PATH"
          
          # Build Backend
          echo "Building Backend..."
          cd backend
          npm install
          npm run build
          cd ..
          
          # Build Frontend
          echo "Building Frontend..."
          cd frontend
          npm install
          npm run build
          
          # Move Frontend to Public Directory
          rm -rf /home/magnetcrmak/htdocs/app.magnetcrm.com/*
          cp -r dist/* /home/magnetcrmak/htdocs/app.magnetcrm.com/
          cd ..
          
          # Restart Backend Server
          pm2 restart magnet-backend || pm2 start app.js --name "magnet-backend"
          echo "Deployment Successful!"
