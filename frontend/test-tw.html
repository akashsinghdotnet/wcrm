<!DOCTYPE html>
<html class="dark">
<head>
    <style>
        .test1 { background: red; }
        .dark\:test1:where(.dark, .dark *) { background: green; }
        
        .dark\:test2:is(.dark *) { background: green; }
        .test2 { background: red; }
        
        .dark .dark\:test3 { background: green; }
        .test3 { background: red; }
    </style>
</head>
<body>
    <!-- test1 corresponds to where AFTER base class -->
    <div style="padding: 10px; margin: 10px;">
        <div class="test2 dark:test2">Test 2 (:is)</div>
        <div class="test3 dark:test3">Test 3 (.dark &)</div>
    </div>
</body>
</html>
